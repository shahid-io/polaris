name: CI

# Runs on every long-lived branch, not just main. develop-v2 carries the current
# implementation and is what a reviewer is pointed at, so leaving it unvalidated until a PR
# exists means the branch people actually read is the one nothing checks.
on:
  push:
    branches: [main, develop, develop-v2]
  pull_request:
  # Lets the pipeline be run on demand, useful for verifying a change to the workflow
  # itself without pushing a commit to main just to trigger it.
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run, no point finishing a build
# for a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        # No version pinned here on purpose: the action reads `packageManager` from
        # package.json. Specifying both is an error, and duplicating the version would let
        # CI drift from what developers run locally.
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile fails rather than silently resolving different versions than
        # the ones committed, so CI validates the dependency set that was reviewed.
        run: pnpm install --frozen-lockfile

      - name: Lint
        # Runs here because the previous lint script had been failing for some time without
        # anyone noticing. Nothing executed it. A check nobody runs is not a check.
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        # No credentials are configured here on purpose. The suite must pass with none,
        # live adapters fall back to recorded fixtures and providers without keys report
        # "skipped", which is the same path a user hits on a clean checkout.
        run: pnpm test

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only worth the browser download once the cheap checks have passed.
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        # Only Chromium: this suite answers "does it work in a real browser", not
        # "does it work in every browser", and downloading three engines to answer the
        # first question is time spent for nothing.
        run: pnpm --filter @polaris/web exec playwright install chromium --with-deps

      - name: Build
        run: pnpm build

      - name: Start API and web
        # Backgrounded rather than driven by Playwright's webServer so a failure to boot
        # shows up as its own step with its own logs, instead of as an opaque test timeout.
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          pnpm --filter @polaris/web exec next start --port 3000 > /tmp/web.log 2>&1 &

      - name: Wait for both servers
        run: |
          npx --yes wait-on http://localhost:4000/api/health http://localhost:3000 --timeout 90000

      - name: Run smoke test
        run: pnpm --filter @polaris/web exec playwright test

      - name: Server logs on failure
        if: failure()
        run: |
          echo "── api ──"; tail -50 /tmp/api.log || true
          echo "── web ──"; tail -50 /tmp/web.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
